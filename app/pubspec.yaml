name: learn_chinese_by_music
description: "Learn Chinese through AI-generated positive-energy songs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Audio
  just_audio: ^0.9.42
  audio_session: ^0.1.25
  record: ^6.2.0

  # Local storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5

  # Auth
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2

  # IAP
  in_app_purchase: ^3.2.2

  # Permissions & connectivity
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
